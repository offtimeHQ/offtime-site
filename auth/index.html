<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create or sign in to your Offtime account." />
    <meta name="referrer" content="no-referrer" />
    <title>Sign in — Offtime.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./auth.css" />
    <script src="./config.js" defer></script>
    <script src="./auth.js" defer></script>
  </head>
  <body>
    <main class="auth-shell">
      <a class="logo" href="../index.html" aria-label="Offtime home">Offtime.</a>
      <section class="auth-card" aria-labelledby="auth-title">
        <p class="eyebrow">Offtime for Mac</p>
        <h1 id="auth-title">Welcome back.</h1>
        <p id="auth-copy" class="intro">Sign in to continue securely in the Offtime app.</p>

        <div class="tabs" role="tablist" aria-label="Account action">
          <button id="signin-tab" type="button" role="tab" aria-selected="true">Sign in</button>
          <button id="signup-tab" type="button" role="tab" aria-selected="false">Create account</button>
        </div>

        <form id="auth-form">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="1024" />
          <p id="password-help" class="help" hidden>Use at least 10 characters.</p>
          <button id="submit" class="submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
          <p id="status" class="status" role="alert" aria-live="polite"></p>
        </form>

        <p class="legal">By creating an account, you agree to our <a href="../terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="../privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</p>
      </section>
    </main>
  </body>
</html>
